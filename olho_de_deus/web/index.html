<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa — Olho de Deus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23C97A2B%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mesa/style.css">
</head>
<body>

<div class="desk">
  <header class="case-cover">
    <div class="case-cover__title">
      <span class="stamp-mark">OD</span>
      <div>
        <h1>Mesa de Investigação</h1>
        <p class="case-cover__sub">Olho de Deus — registro contínuo de câmeras públicas</p>
      </div>
    </div>
    <div class="case-cover__status" id="system-status">
      <span class="seal seal--loading" id="seal">verificando…</span>
    </div>
  </header>

  <div class="folder-shell">
    <nav class="folder-tabs" id="nav-tabs">
      <button class="tab" data-route="painel">
        <span class="tab__index">00</span>Painel
      </button>
      <button class="tab" data-route="ao-vivo">
        <span class="tab__index">01</span>Ao vivo
      </button>
      <button class="tab" data-route="pessoas">
        <span class="tab__index">02</span>Pessoas
      </button>
      <button class="tab" data-route="veiculos">
        <span class="tab__index">03</span>Veículos
      </button>
      <button class="tab" data-route="procurados">
        <span class="tab__index">04</span>Procurados
      </button>
    </nav>

    <main class="board" id="board">
      <!-- preenchido via JS -->
    </main>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__backdrop" id="lightbox-close"></div>
  <div class="lightbox__panel" id="lightbox-panel"></div>
</div>

<script src="/mesa/app.js"></script>
</body>
</html>
