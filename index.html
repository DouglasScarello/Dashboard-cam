<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Vigilância - Olho de Deus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ajustes finos para a barra de rolagem (Estética FBI/Dark) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #10B981; }
        
        /* Efeito de brilho neon no input ativo */
        input:focus { outline: none; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); border-color: #10B981; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 h-screen flex flex-col font-mono overflow-hidden cursor-default select-none">

    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <h1 class="text-xl font-bold tracking-widest text-emerald-500">OLHO DE DEUS <span class="text-xs text-gray-400 ml-2">v0.1</span></h1>
        </div>
        
        <div class="relative w-1/3">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="searchInput" class="bg-gray-900 border border-gray-600 text-gray-100 text-sm rounded-md block w-full pl-10 p-2.5 transition-all duration-300" placeholder="Pesquisar câmera pelo nome único...">
        </div>

        <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded transition-colors duration-200 flex items-center">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            ADICIONAR CÂMERA
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-6 relative">
        <div id="cameraGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

        <!-- Modal do Carrossel (Oculto por padrão) -->
        <div id="carouselModal" class="fixed inset-0 bg-black bg-opacity-95 hidden z-50 flex flex-col justify-center items-center">
            
            <!-- Header do Modal -->
            <div class="absolute top-0 w-full p-6 flex justify-between items-center bg-gray-900 bg-opacity-90 shadow-xl border-b border-gray-700">
                <div class="flex items-center space-x-4">
                    <span id="carouselStatusDot" class="w-4 h-4 rounded-full animate-pulse"></span>
                    <h2 id="carouselCameraName" class="text-2xl font-bold tracking-widest text-white drop-shadow-md">NOME DA CÂMERA</h2>
                    <span id="carouselCameraStatus" class="ml-4 font-bold text-lg tracking-wider">STATUS</span>
                </div>
                <button onclick="fecharCarousel()" class="text-gray-400 hover:text-white bg-gray-800 hover:bg-red-600 rounded-full p-2 transition-colors">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Área da Câmera no Carrossel -->
            <div class="relative w-full h-full flex justify-center items-center px-16 mt-20 pb-16">
                <!-- Seta Esquerda -->
                <button onclick="cameraAnterior()" class="absolute left-8 p-4 bg-gray-800 bg-opacity-50 hover:bg-emerald-600 rounded-full text-white transition-all z-10 shadow-lg border border-gray-600 hover:border-emerald-400">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                
                <!-- Visualização da Câmera (Simulada) -->
                <div class="w-full h-full max-w-7xl max-h-[80vh] bg-black border-2 border-gray-700 flex items-center justify-center rounded-xl shadow-2xl relative overflow-hidden transition-all duration-300" id="carouselVideoContainer">
                    <svg class="w-48 h-48 text-gray-700 opacity-40 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    
                    <div class="absolute top-4 right-4 bg-black bg-opacity-60 px-3 py-1 text-emerald-500 font-mono text-sm rounded border border-emerald-900 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-red-600 mr-2 animate-ping"></span> REC
                    </div>
                    <div class="absolute bottom-4 left-4 bg-black bg-opacity-60 px-3 py-1 text-gray-300 font-mono text-sm rounded border border-gray-800" id="carouselTimestamp">
                        2026-08-30 21:00:00
                    </div>
                </div>

                <!-- Seta Direita -->
                <button onclick="proximaCamera()" class="absolute right-8 p-4 bg-gray-800 bg-opacity-50 hover:bg-emerald-600 rounded-full text-white transition-all z-10 shadow-lg border border-gray-600 hover:border-emerald-400">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
            
            <!-- Indicadores (Bolinhas na base) -->
            <div id="carouselIndicators" class="absolute bottom-8 flex space-x-3">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </main>

    <script>
        // Simulando dados que virão da sua API Python (FastAPI) no futuro
        const mockCameras = [
            { id: 1, nome: "ENTRADA PRINCIPAL - RUA 4", status: "AO VIVO", url: "#" },
            { id: 2, nome: "GARAGEM SUBTERRÂNEA - NÍVEL 2", status: "AO VIVO", url: "#" },
            { id: 3, nome: "CORREDOR LESTE", status: "AO VIVO", url: "#" },
            { id: 4, nome: "SALA DE SERVIDORES", status: "CONECTANDO", url: "#" },
            { id: 5, nome: "PERÍMETRO NORTE", status: "OFFLINE", url: "#" },
            { id: 6, nome: "ALMOXARIFADO", status: "AO VIVO", url: "#" }
        ];

        let camerasAtuais = [...mockCameras]; // Usado para navegação após pesquisa
        let indiceCarouselAtual = 0;

        const cameraGrid = document.getElementById('cameraGrid');
        const searchInput = document.getElementById('searchInput');
        
        // Elementos do Carrossel
        const carouselModal = document.getElementById('carouselModal');
        const carouselCameraName = document.getElementById('carouselCameraName');
        const carouselCameraStatus = document.getElementById('carouselCameraStatus');
        const carouselStatusDot = document.getElementById('carouselStatusDot');
        const carouselIndicators = document.getElementById('carouselIndicators');

        // Função para renderizar os blocos na tela
        function renderizarCameras(cameras) {
            cameraGrid.innerHTML = ''; // Limpa o grid atual
            camerasAtuais = cameras;
            
            if(cameras.length === 0) {
                cameraGrid.innerHTML = '<p class="text-gray-500 col-span-full text-center mt-10">Nenhuma câmera encontrada com este nome.</p>';
                return;
            }

            cameras.forEach((cam, index) => {
                // Define a cor do status
                let statusColor = 'text-emerald-500';
                let dotColor = 'bg-emerald-500';
                if(cam.status === 'OFFLINE') { statusColor = 'text-red-500'; dotColor = 'bg-red-500'; }
                if(cam.status === 'CONECTANDO') { statusColor = 'text-yellow-500'; dotColor = 'bg-yellow-500'; }

                // Cria o bloco HTML
                const camBlock = \`
                    <div onclick="abrirCarousel(\${index})" class="cursor-pointer bg-gray-800 rounded-lg border border-gray-700 overflow-hidden shadow-lg hover:border-emerald-500 hover:shadow-emerald-900/50 transition-all duration-300 relative group transform hover:-translate-y-1">
                        
                        <div class="absolute top-3 left-3 bg-gray-900 bg-opacity-90 px-2 py-1 rounded text-xs font-bold flex items-center z-10 border border-gray-700">
                            <span class="w-2 h-2 rounded-full \${dotColor} mr-2 animate-pulse"></span>
                            <span class="\${statusColor}">\${cam.status}</span>
                        </div>

                        <div class="absolute top-3 right-3 bg-gray-900 bg-opacity-75 p-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity z-10">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                        </div>

                        <div class="h-48 bg-black flex items-center justify-center relative border-b border-gray-700">
                            <svg class="w-12 h-12 text-gray-700 opacity-50 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </div>

                        <div class="p-4 bg-gray-800 flex justify-between items-center">
                            <span class="text-sm font-semibold truncate w-full tracking-wide">\${cam.nome}</span>
                        </div>
                    </div>
                \`;
                cameraGrid.innerHTML += camBlock;
            });
        }

        // Funções do Carrossel
        function atualizarCarrossel() {
            if(camerasAtuais.length === 0) return;
            
            const cam = camerasAtuais[indiceCarouselAtual];
            carouselCameraName.textContent = cam.nome;
            carouselCameraStatus.textContent = cam.status;
            
            // Cores
            let statusColor = 'text-emerald-500';
            let dotColor = 'bg-emerald-500';
            if(cam.status === 'OFFLINE') { statusColor = 'text-red-500'; dotColor = 'bg-red-500'; }
            if(cam.status === 'CONECTANDO') { statusColor = 'text-yellow-500'; dotColor = 'bg-yellow-500'; }
            
            carouselCameraStatus.className = \`ml-4 font-bold text-lg tracking-wider \${statusColor}\`;
            carouselStatusDot.className = \`w-4 h-4 rounded-full animate-pulse \${dotColor}\`;
            
            // Atualizar timestamp simulado
            atualizarTimestamp();

            // Atualizar indicadores
            renderizarIndicadores();
        }

        function atualizarTimestamp() {
            const now = new Date();
            const timeString = now.toISOString().replace('T', ' ').substring(0, 19);
            document.getElementById('carouselTimestamp').textContent = timeString;
        }

        function renderizarIndicadores() {
            carouselIndicators.innerHTML = '';
            camerasAtuais.forEach((_, idx) => {
                const isActive = idx === indiceCarouselAtual;
                carouselIndicators.innerHTML += \`<div class="w-3 h-3 rounded-full \${isActive ? 'bg-emerald-500 scale-125 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : 'bg-gray-600 hover:bg-gray-400'} transition-all duration-300 cursor-pointer" onclick="irParaCamera(\${idx})"></div>\`;
            });
        }

        function abrirCarousel(index) {
            indiceCarouselAtual = index;
            atualizarCarrossel();
            carouselModal.classList.remove('hidden');
        }

        function fecharCarousel() {
            carouselModal.classList.add('hidden');
        }

        function proximaCamera() {
            indiceCarouselAtual = (indiceCarouselAtual + 1) % camerasAtuais.length;
            atualizarCarrossel();
        }

        function cameraAnterior() {
            indiceCarouselAtual = (indiceCarouselAtual - 1 + camerasAtuais.length) % camerasAtuais.length;
            atualizarCarrossel();
        }

        function irParaCamera(index) {
            indiceCarouselAtual = index;
            atualizarCarrossel();
        }

        // Navegação por teclado (Setas e Esc)
        document.addEventListener('keydown', (e) => {
            if (!carouselModal.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') proximaCamera();
                if (e.key === 'ArrowLeft') cameraAnterior();
                if (e.key === 'Escape') fecharCarousel();
            }
        });

        // Filtro em Tempo Real
        searchInput.addEventListener('input', (e) => {
            const termoPesquisa = e.target.value.toLowerCase();
            const camerasFiltradas = mockCameras.filter(cam => 
                cam.nome.toLowerCase().includes(termoPesquisa)
            );
            renderizarCameras(camerasFiltradas);
        });

        // Renderiza tudo ao iniciar a página
        renderizarCameras(mockCameras);
        
        // Atualizar timer
        setInterval(() => {
            if (!carouselModal.classList.contains('hidden')) {
                atualizarTimestamp();
            }
        }, 1000);
    </script>
</body>
</html>
