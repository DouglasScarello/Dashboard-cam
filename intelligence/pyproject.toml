[tool.poetry]
name = "intelligence"
version = "1.0.0"
description = "Módulo 3 — Ingestão e banco de dados de procurados e desaparecidos"
authors = ["Olho de Deus OSS"]
# Não é um pacote instalável, é uma pasta de scripts (mesmo padrão de
# ../olho_de_deus/pyproject.toml) — sem isso `poetry install` falha tentando
# empacotar "intelligence" como se fosse uma lib de verdade.
package-mode = false

[tool.poetry.dependencies]
# Alinhado com ../olho_de_deus/pyproject.toml de propósito: torchvision,
# tensorflow (via deepface) e faiss-cpu não publicam wheels pra Python 3.14
# (o padrão do sistema) no momento — o venv precisa ficar em 3.11, senão
# `poetry install` falha silenciosamente em pacotes ABI-incompatíveis
# (descoberto tentando consertar as dependências faltantes, 2026-09-10).
python = ">=3.11,<4.0"
requests  = "^2.31"
tqdm      = "^4.66"
faiss-cpu = "^1.7"
deepface  = "^0.0.93"
numpy     = "^1.26"
playwright= "^1.41"
# Importados incondicionalmente por intelligence_db.py mas nunca declarados
# aqui — sem eles `poetry run python3 <qualquer script>.py` falha na
# primeira linha com ModuleNotFoundError. Versões alinhadas com
# ../olho_de_deus/pyproject.toml (mesmas que já rodam de verdade em produção).
psycopg2-binary = "^2.9.11"
python-dotenv   = "^1.2.2"
# Usados por classify_images.py, ocr_documents.py e clip_similarity_index.py
# (mesma justificativa acima).
easyocr        = "^1.7.2"
open-clip-torch = "^3.3.0"
# Dependência obrigatória de easyocr e open-clip-torch (confirmado via
# `pip show`) mas não puxada automaticamente pelo resolver do poetry nesse
# ambiente — declarar explícito evita ModuleNotFoundError silencioso.
torchvision = "*"

[tool.poetry.scripts]
populate  = "populate_db:main"
search    = "intelligence_db:interactive_search"
ingest    = "global_ingestion:main"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
