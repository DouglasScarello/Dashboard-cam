api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555/tcp"
  # Candidates para WebRTC com baixa latência em LAN/Local (RFC 5245)
  candidates:
    - 127.0.0.1         # loopback local

streams:
  # Câmeras com remuxing puro de vídeo (zero-transcoding) e áudio em Opus para conformidade WebRTC
  # As NAL units originais H.264/H.265 transitam diretamente para os pacotes RTP sem perda de píxeis
  #
  # Exemplo de canal com remuxing puro:
  # camera_estacionamento:
  #   - rtsp://admin:password@192.168.1.100:554/cam/realmonitor?channel=1&subtype=0
  #   - "ffmpeg:camera_estacionamento#video=copy#audio=opus"

log:
  level: warn
